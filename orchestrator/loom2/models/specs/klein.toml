# FLUX.2 Klein (04 §3): distilled 4-step variants run ICM (Fill-Match, Remove); base variants partial-denoise (refine, tiled refine).
# D31: the 9B family defaults to the Qwen3-8B Q4_K_M GGUF encoder (stays resident beside the transformer), fp8 as the alternate.

[[model]]
id = "klein-4b"
family = "klein"
base = "klein-4b"
order = 4
label = "Klein 4B"
graph = "klein"
roles.te = { default = "qwen3-4b" }
roles.vae = "flux2-vae"
sampling = { steps = 4, guidance = 1.0, cfg = 1.0, weight_dtype = "fp8_e4m3fn", distilled = true, json_prompt = false, model_shift = 2.02 }
recipes = { t2i = true, inpaint = ["fill", "fill_match", "remove", "outpaint"], icm_default = ["open"], reangle = "klein_prompt", reangle_moves = ["topdown", "closeup", "wide"], stage = "clay" }   # P14: the framing moves under `open` (9B is flux-nc); unmeasured on 4B. ST3: the clay method under `open`, unmeasured
inputs = { refs_max = 4 }
geometry = { size_mult = 16, tiers = { thumb = [896, 512], draft = [1280, 720], full = [1920, 1088] } }
estimates = { vram_gb = 8.5, base_seconds = 10.0, doc_seconds = 28.0 }

