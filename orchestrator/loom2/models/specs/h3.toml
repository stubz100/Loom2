# MiniMax H3 (D9, D192, D193): the hero clip — first + last frame (or the start alone) with its sound, on the pinned core's own H3 nodes.
# E64 (journal 2026-11-05 17:26): 864×480 × 124 f @ 24 in 138 s warm / 151 s cold on 8 turbo steps, 1024×576 in 241 s, 1344×768 in
# 21 min (not offered: max_px); VRAM peak 8.4–9.7 GB, the weights memory-mapped. Offered only while Settings' H3 confirmation is on
# (the roster's `confirm`).
[[model]]
id = "minimax-h3-fl2va-fp8"
family = "minimax_h3"
label = "MiniMax H3 · hero, with sound"
short = "H3"
hint = "The best motion and end-frame reach of the three (E64); makes the clip's sound; ≈ 2.3 min per 5 s at Draft"
order = 2
graph = "minimax_h3"
roles.te = { default = "minimax-h3-encoder-bf16" }
roles.vae = "minimax-h3-video-vae"
roles.extra = { audio_vae = "minimax-h3-audio-vae", turbo_lora = "minimax-h3-turbo-8step" }
sampling = { sampler = "res_multistep", scheduler = "simple" }   # ComfyUI's "Image to Video (MiniMax H3)" blueprint
recipes = { i2v = true, flf = true, flf_holds = true }   # E64: a gradual rise to the end pose, no morph
geometry = { size_mult = 32, frame_step = 17, frame_base = 5, fps = 24, fps_fixed = true, frames = 124, size = [864, 480], max_px = 589824, tiers = { draft = [864, 480], hd = [1024, 576], portrait = [480, 864], square = [640, 640] } }
estimates = { vram_gb = 10.0, work_exponent = 1.58, source = "baseline (E64 2026-11-05)" }   # E64: 9.67 GB peak; 241 / 138 s at 1.42× the pixels → 1.58

[model.video]
label = "MiniMax H3 · hero, with sound"
negative = ""
takes_negative = false
sound = true

[model.video.presets]
draft = { label = "Draft · 8 steps, turbo LoRA (≈ 2.3 min at 480p)", steps = 8, turbo = true, seconds = 138.0 }   # E64 warm; 151 s cold
