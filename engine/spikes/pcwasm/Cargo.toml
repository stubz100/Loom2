# S2 spike (PE6): PhotoCraft's Quick Selection and Magnetic Lasso (photocraft-algo segment::quick, magnetic) built for
# wasm32-unknown-unknown with a plain C ABI (no wasm-bindgen), to measure the module size and the per-stroke latency in a Worker.
# Spike only — it depends on the local PhotoCraft checkout by path; an adoption would pin the git commit instead.
# Build:  cargo build --release --target wasm32-unknown-unknown --manifest-path engine/spikes/pcwasm/Cargo.toml
[package]
name = "loom2-pcwasm"
version = "0.0.1"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
photocraft-algo = { path = "../../../../photocraft/crates/algo" }
photocraft-geom = { path = "../../../../photocraft/crates/geom" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[workspace]
