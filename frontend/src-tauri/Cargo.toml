[package]
name = "app"
version = "0.1.0"
description = "loom2 — storyboard studio shell (Tauri 2)"
authors = ["stubz100"]
license = ""
repository = "https://github.com/stubz100/Loom2"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
ureq = { version = "3", default-features = false }
