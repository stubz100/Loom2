# Edit tools (M5): upscalers and AI Select. Seconds from the M5 acceptance (warm).
# E40 → D153 (2026-10-28): SeedVR2 3B is the Upscale tool's default — the "add real detail" upscaler of 04 §4 — on ComfyUI's core nodes (no custom
# node): a Lanczos resize by the factor, a one-step restoration at that size (euler / simple, cfg 1, denoise 1), the colour matched in Lab to the
# resize. Measured (E40, the bench's 960×544 boards): ×2 7–8 s warm, 11 s cold, peak 8.7 GB, 2–10× ESRGAN's detail by the Laplacian measure;
# ×4 fits (30–33 s) but over-textures a Draft board's small faces → offered at ×2 only (an FHD board to 4K is a second ×2). ESRGAN stays the cheap one.
[[model]]
id = "seedvr2-3b"
family = "tools"
label = "SeedVR2 3B ×2 · adds real detail"
short = "SeedVR2"
hint = "a one-step restoration at twice the size — hair, weave and skin drawn in (E40); the colour matched to the source"
order = 90
graph = "seedvr2"
roles.vae = "seedvr2-vae"
recipes = { default_for = ["upscale"], upscale_factor = 2 }
estimates = { vram_gb = 9.0, doc_seconds = 8.0, cold_seconds = 11.0 }

[[model]]
id = "realesrgan-x2"
family = "tools"
label = "Real-ESRGAN 2× · cheap"
graph = "esrgan"
recipes = { upscale_factor = 2 }
estimates = { vram_gb = 2.0, doc_seconds = 6.0 }

[[model]]
id = "realesrgan-x4"
family = "tools"
label = "Real-ESRGAN 4×"
graph = "esrgan"
recipes = { upscale_factor = 4 }
estimates = { vram_gb = 2.5, doc_seconds = 6.0 }

[[model]]
id = "birefnet"
family = "tools"
label = "Subject · BiRefNet"
graph = "matte"
recipes = { default_for = ["segment"], segment = ["subject"] }
estimates = { vram_gb = 2.5, doc_seconds = 2.5 }

[[model]]
id = "sdpose-wholebody"
family = "tools"
label = "Body keypoints · SDPose"
graph = "keypoints"
roles.extra = { detector = "rtdetr-v4" }
recipes = { default_for = ["keypoints"], keypoints = true }   # CA1b (D104): a figure fitted to its character's animation reference
estimates = { vram_gb = 3.0, doc_seconds = 4.0 }             # E10's scorer: 1–2 s a frame warm, the 1.9 GB checkpoint's load on top

[[model]]
id = "sam3"
family = "tools"
label = "SAM 3"
graph = "sam"
recipes = { segment = ["text", "points", "box"] }
estimates = { vram_gb = 5.0, doc_seconds = 3.5 }

# SC3 (D120, E30 2026-10-22): a set from an image — MoGe-2's metric point map of a picture of a place, triangulated by the engine into a
# textured relief (MoGePointMapToMesh); the camera that took the picture at the origin. Under a second an image once loaded, 1.4 GB.
[[model]]
id = "moge2-vitl"
family = "pixal3d"
label = "A set from an image · MoGe-2"
short = "MoGe"
hint = "a picture of a place as a relief the camera can move in a little — the picture itself is the plate"
order = 61
graph = "image_to_set"
recipes = { set = true, default_for = ["set"] }
estimates = { vram_gb = 2.0, base_seconds = 1.0, cold_seconds = 5.0 }
