# loom2 model mounts for the headless ComfyUI engine (decision D1: ComfyUI layout convention).
# Passed with: python main.py --extra-model-paths-config engine/extra_model_paths.yaml
#
# loom2_models = loom2's own roster-managed root (fetch jobs land here; default save location) — the only tree the engine reads.
# D80 (2026-10-12): the author's old ComfyUI install on D: is a backup drive, not a model source; its mount (D15) is gone and
# everything loom2 runs lives under F:/loom2-models.

loom2_models:
  base_path: F:/loom2-models
  is_default: true
  diffusion_models: diffusion_models
  unet: diffusion_models
  text_encoders: text_encoders
  clip: text_encoders
  vae: vae
  loras: loras
  controlnet: controlnet
  upscale_models: upscale_models
  clip_vision: clip_vision
  embeddings: embeddings
  background_removal: background_removal
  model_patches: model_patches                # D74 / E10: core ModelPatchLoader (Fun ControlNet patches)
  geometry_estimation: geometry_estimation    # D74 / E10: Depth Anything 3 (scoring)
  # sam3.pt lives in sam3/; core ComfyUI loads it with CheckpointLoaderSimple, so that folder is also a checkpoints path
  checkpoints: |
    checkpoints
    sam3
  sam3: sam3
