# loom2 CI (12 §8 M7, D26): the offline test suite and the frontend build on every push and pull request, and the two Windows
# installers (`full` and `open`) on pushes to main and on tags. The runners have no GPU: the `open` smoke test is the
# offline suite run with LOOM2_VARIANT=open (roster filtering, contract checks on the open models — Klein 4B, Wan 2.2).
# The engine (ComfyUI submodule + ROCm torch venv) is set up on the target machine by scripts/setup.ps1, never built here.
# D36: every push checks that all version locations match VERSION; a tag v<VERSION> also publishes a *draft* GitHub release
# with both installers attached (a human reviews and publishes it).
# D40: compose.py is checked against Photoshop's own composites in a pinned psd-tools corpus (fetched, hash-verified, cached).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: offline tests + frontend (${{ matrix.variant }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [full, open]
    env:
      LOOM2_VARIANT: ${{ matrix.variant }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: orchestrator venv
        run: uv sync --project orchestrator --extra dev --extra oracle
      - name: psd-tools corpus cache (D40)
        uses: actions/cache@v4
        with:
          path: bench/corpus/psd-tools
          key: psd-tools-corpus-${{ hashFiles('bench/corpus/psd-tools.sha256') }}
      - name: psd-tools corpus (D40) — fetch what is missing, verify every SHA-256
        run: orchestrator/.venv/Scripts/python.exe scripts/fetch_corpus.py
      - name: offline tests
        run: orchestrator/.venv/Scripts/python.exe -m pytest orchestrator -q --timeout 180
      - name: Photoshop oracle (D40) — compose.py vs the corpus' merged images, ratcheting floor (fails if it would skip)
        run: orchestrator/.venv/Scripts/python.exe -m pytest orchestrator -q -s -m corpus
      - name: agent docs (D35) — paths exist, verified-at lines present
        run: orchestrator/.venv/Scripts/python.exe scripts/agents_check.py
      - name: settings audit (D60) — every Settings field, recipe field and /capabilities parameter reaches the code that runs
        run: orchestrator/.venv/Scripts/python.exe scripts/settings_audit.py
      - name: smart-select WebAssembly (D59) — the committed module matches its PhotoCraft pin and checksum
        run: orchestrator/.venv/Scripts/python.exe scripts/build_pcwasm.py --check
      - name: versions (D36) — every location matches VERSION
        run: orchestrator/.venv/Scripts/python.exe scripts/bump_version.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: frontend build (tsc -b + vite)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: API contract (D38) — openapi.json and schema.d.ts match the app
        shell: bash
        run: |
          orchestrator/.venv/Scripts/python.exe scripts/export_openapi.py --check
          cd frontend && npm run api:types && git diff --exit-code -- src/api/schema.d.ts

  installers:
    name: installer (${{ matrix.variant }})
    needs: test
    if: github.event_name == 'push'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [full, open]
    env:
      LOOM2_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - name: frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          if (-not (Test-Path node_modules/.bin/tauri.cmd)) { npm i -D @tauri-apps/cli@^2 }
      - name: tauri build (variant baked into the shell)
        working-directory: frontend
        run: npx tauri build
      - name: name the bundles by variant
        shell: pwsh
        run: |
          $out = "dist-installers"; New-Item -ItemType Directory -Force $out | Out-Null
          Get-ChildItem frontend/src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $out ("loom2-${{ matrix.variant }}-" + $_.Name))
          }
          Get-ChildItem $out
      - uses: actions/upload-artifact@v4
        with:
          name: loom2-${{ matrix.variant }}-installer
          path: dist-installers/*
          if-no-files-found: error

  release:
    name: draft release (tags v*)
    needs: installers
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: the tag matches VERSION
        run: test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: loom2-*-installer
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: loom2 ${{ github.ref_name }}
          files: installers/*
          generate_release_notes: true
