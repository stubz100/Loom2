# loom2 CI (12 §8 M7, D26): the offline test suite and the frontend build on every push and pull request, and the two Windows
# installers (`full` and `open`) on pushes to main and on tags. The runners have no GPU: the `open` smoke test is the
# offline suite run with LOOM2_VARIANT=open (roster filtering, contract checks on the open models — Klein 4B, Wan 2.2).
# The engine (ComfyUI submodule + ROCm torch venv) is set up on the target machine by scripts/setup.ps1, never built here.
# D36: every push checks that all version locations match VERSION; a tag v<VERSION> also publishes a *draft* GitHub release
# with both installers attached (a human reviews and publishes it).
# D40: compose.py is checked against Photoshop's own composites in a pinned psd-tools corpus (fetched, hash-verified, cached).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: offline tests + frontend (${{ matrix.variant }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [full, open]
    env:
      LOOM2_VARIANT: ${{ matrix.variant }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: orchestrator venv
        run: uv sync --project orchestrator --extra dev --extra oracle --extra native
      - name: psd-tools corpus cache (D40)
        uses: actions/cache@v4
        with:
          path: bench/corpus/psd-tools
          key: psd-tools-corpus-${{ hashFiles('bench/corpus/psd-tools.sha256') }}
      - name: psd-tools corpus (D40) — fetch what is missing, verify every SHA-256
        run: orchestrator/.venv/Scripts/python.exe scripts/fetch_corpus.py
      - name: offline tests
        run: orchestrator/.venv/Scripts/python.exe -m pytest orchestrator -q --timeout 180
      - name: Photoshop oracle (D40) — compose.py vs the corpus' merged images, ratcheting floor (fails if it would skip)
        run: orchestrator/.venv/Scripts/python.exe -m pytest orchestrator -q -s -m corpus
      - name: agent docs (D35) — paths exist, verified-at lines present
        run: orchestrator/.venv/Scripts/python.exe scripts/agents_check.py
      - name: settings audit (D60) — every Settings field, recipe field and /capabilities parameter reaches the code that runs
        run: orchestrator/.venv/Scripts/python.exe scripts/settings_audit.py
      - name: model ids live in the specs (D65) — no quoted roster id in the orchestrator's or the frontend's code
        run: orchestrator/.venv/Scripts/python.exe scripts/model_literals_check.py
      - name: content-aware wheel (D62) — the committed extension matches its PhotoCraft pin and checksum
        run: orchestrator/.venv/Scripts/python.exe scripts/build_pcalgo.py --check
      - name: smart-select WebAssembly (D59) — the committed module matches its PhotoCraft pin and checksum
        run: orchestrator/.venv/Scripts/python.exe scripts/build_pcwasm.py --check
      - name: EffectCraft pin (AE1, D114) — the pin is well formed and matches the built CLI when it is present
        run: orchestrator/.venv/Scripts/python.exe scripts/build_effectcraft.py --check
      - name: FilmCraft pin (CE1, D126) — the pin is well formed and matches the built CLI when it is present
        run: orchestrator/.venv/Scripts/python.exe scripts/build_filmcraft.py --check
      - name: VST3 host pin (AU3, D127) — the pin is well formed, names the host's source as it is, and matches the built host when it is present
        run: orchestrator/.venv/Scripts/python.exe scripts/build_vsthost.py --check
      - name: versions (D36) — every location matches VERSION
        run: orchestrator/.venv/Scripts/python.exe scripts/bump_version.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: frontend build (tsc -b + vite)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: frontend lint (oxlint) — CLAUDE.md's table names it, CI runs it (V47)
        working-directory: frontend
        run: npm run lint
      - name: frontend unit tests (D68) — vitest, incl. the D32 command audit
        working-directory: frontend
        run: npm test
      - name: production CSP (B24) — the build under tauri.conf.json's policy in headless Edge against the orchestrator (V47)
        run: orchestrator/.venv/Scripts/python.exe scripts/csp_check.py
      - name: end-to-end smoke (D68) — Playwright on Edge (WebGL2) against the orchestrator and the fake engine, this variant
        working-directory: frontend
        run: |
          npm run build:e2e
          npm run test:e2e
      - name: smoke results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-${{ matrix.variant }}
          path: frontend/node_modules/.e2e/smoke
          if-no-files-found: ignore
      - name: API contract (D38) — openapi.json and schema.d.ts match the app
        shell: bash
        run: |
          orchestrator/.venv/Scripts/python.exe scripts/export_openapi.py --check
          cd frontend && npm run api:types && git diff --exit-code -- src/api/schema.d.ts

  shell:
    name: shell compiles (cargo check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - name: cargo check — V47, a pull request that breaks lib.rs no longer passes green
        working-directory: frontend/src-tauri
        run: cargo check --locked

  installers:
    # V46 (C22): the bundles hold the shell only — they need a checkout prepared by scripts/setup.ps1 beside them (the orchestrator, its
    # venv, the engine) — so they are built for a tag's draft release, not on every push to main (two Rust builds a push bought nothing)
    name: shell installer (${{ matrix.variant }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [full, open]
    env:
      LOOM2_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - name: frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          if (-not (Test-Path node_modules/.bin/tauri.cmd)) { npm i -D @tauri-apps/cli@^2 }
      - name: tauri build (variant baked into the shell)
        working-directory: frontend
        run: npx tauri build
      - name: name the bundles by variant
        shell: pwsh
        run: |
          $out = "dist-installers"; New-Item -ItemType Directory -Force $out | Out-Null
          Get-ChildItem frontend/src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $out ("loom2-${{ matrix.variant }}-shell-" + $_.Name))
          }
          Get-ChildItem $out
      - uses: actions/upload-artifact@v4
        with:
          name: loom2-${{ matrix.variant }}-shell-installer
          path: dist-installers/*
          if-no-files-found: error

  release:
    name: draft release (tags v*)
    needs: installers
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: the tag matches VERSION
        run: test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: loom2-*-installer
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: loom2 ${{ github.ref_name }}
          body: "The installers hold the Tauri shell only (V46, C22): run them beside a checkout prepared by scripts/setup.ps1 (the orchestrator, its venv and the engine), or set LOOM2_REPO to it."
          files: installers/*
          generate_release_notes: true
